name: Release

# Neues Release: Version in tv/app/appinfo.json erhöhen, committen, dann Tag pushen:
#   git tag v1.4.1 && git push origin v1.4.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version prüfen (Tag muss zu appinfo.json passen)
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("tv/app/appinfo.json"))["version"])')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu appinfo.json ($VERSION)"; exit 1
          fi

      - name: JavaScript-Syntax prüfen
        run: for f in tv/app/js/*.js tv/app/js/lang/*.js; do node --check "$f"; done

      - name: Übersetzungen vollständig?
        run: node tv/tools/i18n_check.js

      - name: IPK + Manifest bauen
        run: python3 tv/tools/build_ipk.py

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tv/dist/*.ipk
            tv/dist/*.manifest.json
          generate_release_notes: true
