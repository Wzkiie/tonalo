name: Release

# Neues Release: Version in tv/app/appinfo.json erhöhen, committen, dann Tag pushen:
#   git tag v1.4.1 && git push origin v1.4.1
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Fremde Actions auf feste Commits gepinnt (nicht auf Tags, die man umhängen kann) – schützt die Releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Version prüfen (Tag muss zu appinfo.json passen)
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("tv/app/appinfo.json"))["version"])')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu appinfo.json ($VERSION)"; exit 1
          fi

      - name: JavaScript-Syntax prüfen
        run: for f in tv/app/js/*.js tv/app/js/lang/*.js; do node --check "$f"; done

      - name: Übersetzungen vollständig?
        run: node tv/tools/i18n_check.js

      - name: IPK + Manifest bauen
        run: python3 tv/tools/build_ipk.py

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            tv/dist/*.ipk
            tv/dist/*.manifest.json
          generate_release_notes: true
