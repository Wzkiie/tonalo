name: Windows-Testbuild

# Nur von Hand (Actions -> Windows-Testbuild -> Run workflow): baut den Installer zum Ausprobieren,
# ohne Release – installierte Apps bekommen davon nichts mit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Windows-App bauen
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tonalo-Windows
          path: desktop/dist/Tonalo-Setup-*.exe
          retention-days: 7
